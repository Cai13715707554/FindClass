# 构建期 JVM 参数。
#
# 调参背景（本机实测）：
#  - 默认 512m 堆编译 Compose 时会 GC 抖动甚至失败，所以要放大；
#  - 但也不能太大：本机测试时出现过「守护进程在执行构建的瞬间被外部杀掉」
#    （无堆转储、无异常），特征是 Gradle 进程 + Kotlin 编译进程两个 JVM 同时占内存。
#    因此这里**取消独立的 Kotlin 编译进程**，改为进程内编译，只留一个 JVM。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process

org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
