# 构建期 JVM 参数。
# 默认 512m 堆在编译 Compose + Kotlin 时会频繁 GC 甚至直接失败，这里显式放大。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Kotlin 编译进程单独配置，避免和 Gradle 守护进程抢内存
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
